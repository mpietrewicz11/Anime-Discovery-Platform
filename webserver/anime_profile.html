<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Profile</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f1220;color:#e9ecff;min-height:100vh;padding:20px 16px;}
.container{max-width:720px;margin:0 auto;}
.profile-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:20px;margin-bottom:20px;}
.avatar{width:64px;height:64px;border-radius:50%;background:#800080;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:white;margin-bottom:14px;}
.username{font-size:22px;font-weight:700;margin-bottom:6px;}
.bio{color:rgba(233,236,255,0.7);font-size:14px;line-height:1.6;}
.section-title{font-size:16px;font-weight:600;margin-bottom:14px;}
.review-item{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;margin-bottom:10px;}
.review-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.review-title{font-weight:600;font-size:14px;flex:1;min-width:0;word-break:break-word;}
.score{background:#800080;color:white;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap;}
.review-text{font-size:13px;color:rgba(233,236,255,0.7);line-height:1.5;}
.review-date{font-size:11px;color:rgba(233,236,255,0.4);margin-top:6px;}
.watch-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07);flex-wrap:wrap;}
.watch-item:last-child{border-bottom:none;}
.status{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
.watching{background:rgba(0,200,100,0.15);color:#6effc0;}
.done{background:rgba(100,100,255,0.15);color:#b3b3ff;}
.plan_of_watch{background:rgba(255,200,0,0.1);color:#ffe87a;}
.hold{background:rgba(255,150,0,0.1);color:#ffcc80;}
.dropped{background:rgba(255,77,109,0.1);color:#ffb3c1;}
</style>
</head>
<body>
<!-- Profile -->
<div class="container">
  <div class="profile-card">
    <div class="avatar" id="avatar"></div>
    <div class="username" id="username"></div>
    <div class="bio" id="bio"></div>
  </div>
<!-- The reviews and ratings -->
  <div class="profile-card">
    <div class="section-title">Reviews & Ratings</div>
    <div id="reviews"></div>
  </div>
<!-- User watchlist -->
  <div class="profile-card">
    <div class="section-title">Watchlist</div>
    <div id="watchlist"></div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const profileUsername = params.get("username");
if (!profileUsername) {
  document.querySelector(".container").innerHTML = '<p style="color:rgba(233,236,255,0.5)">No user specified.</p>';
}
fetch(`anime_profile_get.php?username=${encodeURIComponent(profileUsername)}`)
  .then(r => r.json())
  .then(data => {
    if (!data.ok) {
      document.querySelector(".container").innerHTML = `<p style="color:rgba(233,236,255,0.5)">${data.error || "Could not load profile."}</p>`;
      return;
    }
    const u = data.user;
// This will take the first 2 characters from their username
    document.getElementById("avatar").textContent = u.username.slice(0,2).toUpperCase();
    document.getElementById("username").textContent = u.username;
    document.getElementById("bio").textContent = u.bio || "Nothing in bio yet.";
    const reviewsDiv = document.getElementById("reviews");
    if(data.reviews.length === 0){
      reviewsDiv.innerHTML = '<p style="color:rgba(233,236,255,0.4)">No reviews yet.</p>';
    } else {
      data.reviews.forEach(r => {
        reviewsDiv.innerHTML += `
          <div class="review-item">
            <div class="review-top">
              <span class="review-title">${r.title}</span>
              <span class="score">${r.score} / 10</span>
            </div>
            <div class="review-text">${r.review_text || ""}</div>
            <div class="review-date">${r.created_at}</div>
	    </div>`;
      });
    }

    const watchDiv = document.getElementById("watchlist");
    if(data.watchlist.length === 0){
      watchDiv.innerHTML = '<p style="color:rgba(233,236,255,0.4)">No watchlist as of yet.</p>';
    } else {
      data.watchlist.forEach(w => {
        watchDiv.innerHTML += `
          <div class="watch-item">
            <span>${w.title}</span>
            <span class="status ${w.status}">${w.status.replace(/_/g," ")}</span>
          </div>`;
      });
    }
  });
</script>
</body>
</html>
