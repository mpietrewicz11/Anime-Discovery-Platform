<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: #0f1220;
      color: #e9ecff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .card{
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 22px;
    }

    h1{
      margin: 0 0 8px;
      font-size: 26px;
    }

    .sub{
      margin: 0 0 18px;
      color: rgba(233,236,255,0.75);
      font-size: 14px;
      line-height: 1.4;
    }

    label{
      display:block;
      margin: 10px 0 6px;
      font-size: 13px;
      color: rgba(233,236,255,0.75);
    }

    input{
      width:100%;
      padding:10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.25);
      color: #e9ecff;
      outline:none;
    }

    input:focus{
      border-color: rgba(124,92,255,0.7);
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 10px;
      font-size: 13px;
      color: rgba(233,236,255,0.75);
    }

    .row input{
      width:auto;
      margin:0;
    }

    .msg{
      display:none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
    }

    .msg.success{
      border-color: rgba(0,255,160,0.25);
      background: rgba(0,255,160,0.10);
      color: #b9ffe6;
    }

    .msg.error{
      border-color: rgba(255,77,109,0.35);
      background: rgba(255,77,109,0.10);
      color: #ffb3c1;
    }

    button{
      width:100%;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor:pointer;
      background: #7c5cff;
      color: white;
      font-weight: 600;
      font-size: 15px;
    }

    button:hover{
      filter: brightness(1.05);
    }

    .link{
      margin-top: 14px;
      font-size: 14px;
      color: rgba(233,236,255,0.75);
    }

    .link a{
      color: #7c5cff;
      text-decoration:none;
    }

    .link a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Login</h1>
    <p class="sub">Log in to rate anime, leave comments, and manage your watchlists.</p>

    <div id="message" class="msg"></div>

    <form id="loginForm" method="POST" action="login.php">
      <input type="hidden" name="type" value="login">

      <label for="username">Username</label>
      <input id="username" type="text" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required />

      <div class="row">
        <input id="showPass" type="checkbox" />
        <span>Show password</span>
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="link">
      New here? <a href="register.html">Create an account</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const messageDiv = document.getElementById("message");

    function showMessage(text, type){
      messageDiv.textContent = text;
      messageDiv.classList.add(type);
      messageDiv.style.display = "block";
    }

    // URL param messages
    if (params.get("registered") === "1") {
      showMessage("Registration successful. Please log in.", "success");
    }

    if (params.get("error") === "login_failed") {
      showMessage("Login failed. Try again.", "error");
    }

    if (params.get("error") === "fields_required") {
      showMessage("All fields are required.", "error");
    }

    // Show/hide password
    document.getElementById("showPass").addEventListener("change", (e) => {
      document.getElementById("password").type = e.target.checked ? "text" : "password";
    });

    // Small client side check so it feels more “functional”
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();

      if (!u || !p) {
        e.preventDefault();
        showMessage("Please fill out both fields.", "error");
      }
    });
  </script>
</body>
</html>
