<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logisdfsdfsdfn</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f1220;
  color:#e9ecff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:22px;
}

h1{
  margin:0 0 8px;
}

.sub{
  color:rgba(233,236,255,0.75);
  margin-bottom:18px;
}

label{
  display:block;
  margin:10px 0 6px;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(0,0,0,0.25);
  color:#e9ecff;
}

button{
  width:100%;
  margin-top:16px;
  padding:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#ff4d4d;
  color:white;
  font-weight:600;
}

.msg{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
}

.msg.error{
  background:rgba(255,77,109,0.1);
  border:1px solid rgba(255,77,109,0.35);
  color:#ffb3c1;
}

.msg.success{
  background:rgba(0,255,160,0.1);
  border:1px solid rgba(0,255,160,0.25);
  color:#b9ffe6;
}
</style>
</head>

<body>

<div class="card">

<h1>Login</h1>
<p class="sub">Log in to rate anime and manage your watchlists.</p>

<div id="message" class="msg"></div>

<form method="POST" action="login.php">

<input type="hidden" name="type" value="login">

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">Login</button>

</form>

<p style="margin-top:14px;">
New here? <a href="register.html">Create an account</a>
</p>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const messageDiv = document.getElementById("message");
//added this to show error when the password is incorrect
function showMessage(text,type){
  messageDiv.textContent = text;
  messageDiv.classList.add(type);
  messageDiv.style.display="block";
}

if(params.get("registered")==="1"){
  showMessage("Registration successful. Please log in.","success");
}
//i fixed here because it didn't wanted to show the error message
if(params.get("error")==="login_failed"){
  showMessage("Login failed. Try again.","error");
}

if(params.get("error")==="fields_required"){
  showMessage("All fields are required.","error");
}

</script>

</body>
</html>
